services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  ingest:
    build: .
    depends_on: [mongo]
    # Replace the ROR id with the institution you want to ingest.
    command: ["ingest", "--ror", "https://ror.org/01jdpyv68", "--max-pages", "2", "--mongo-uri", "mongodb://mongo:27017"]
volumes:
  mongo-data:
